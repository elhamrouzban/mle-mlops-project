stages:
  extract:
    cmd: uv run python src/extract.py
    deps:
      - src/extract.py
      - src/config.py
    params:
      - data.year
      - data.month
      - data.color
      - data.raw_dir
    outs:
      - data/raw

  load:
    cmd: uv run python src/load.py
    deps:
      - src/load.py
      - src/preprocess.py
      - src/config.py
      - data/raw
    params:
      - data
      - features
      - target
    outs:
      - data/processed

  train:
    cmd: uv run python src/train.py
    deps:
      - src/train.py
      - src/config.py
      - data/processed
      - uv.lock
    params:
      - features
      - target
      - train
      - mlflow
